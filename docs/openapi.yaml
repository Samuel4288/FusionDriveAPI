                - Password
              properties:
                LicenseID:
                  type: string
                  description: License identifier
                Password:
                  type: string
                  description: Authentication password
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  itemsstonefinishing:
