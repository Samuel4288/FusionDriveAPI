openapi: 3.0.3
info:
  title: Slab Inventory API
  description: API for managing stone slabs, inventory, and catalog information
  version: 1.0.0
servers:
  - url: https://fusiondriveapi.samuel-63b.workers.dev
    description: Production server

paths:
  /GetSlabsModifiedAfterChangeID:
    post:
      summary: Get Slabs Modified After ChangeID
      description: |
        Retrieves Slabs modified/added since lastID, this allows to make less requests. example: call this function every 5 to 10min, keep LastID and use it in the next call.

        **Example curl command:**
        ```
        curl -X POST https://fusiondriveapi.samuel-63b.workers.dev/GetSlabsModifiedAfterChangeID -H "Content-Type: application/x-www-form-urlencoded" -d "LicenseID=myLicense&Password=myPassword&LastID=12000000"
        ```
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - LicenseID
                - Password
                - LastID
              properties:
                LicenseID:
                  type: string
                  description: License identifier
                Password:
                  type: string
                  description: Authentication password
                LastID:
                  type: string
                  description: LastID given by this function (first use write number 1)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                  - type: string
                    example: "No Slabs found"
                  - type: array
                    items:
                      type: object
                      properties:
                        ID:
                          type: integer
                        BlockName:
                          type: string
                        Reference:
                          type: string
                        JobID:
                          type: string
                        Width:
                          type: number
                        Height:
                          type: number
                        ReceiptWidth:
                          type: number
                        ReceiptHeight:
                          type: number
                        RegDate:
                          type: string
                        ParentSlabID:
                          type: integer
                        IsRemnant:
                          type: integer
                        CostPerM2:
                          type: number
                        thumbnail:
                          type: string
                        MatchURL:
                          type: string
                        EQURL:
                          type: string
                        EdgeURL:
                          type: string
                        OptimizedURL:
                          type: string
                        DrawingInkURL:
                          type: string
                        thumbnailClass:
                          type: string
                        ClassFileURL:
                          type: string
                        RemnantPoints:
                          type: string
                        Status:
                          type: integer
                        StoneTypeName:
                          type: string
                        StoneName:
                          type: string
                        ClassName:
                          type: string
                        FinishingName:
                          type: string
                        ThicknessName:
                          type: string
        '400':
          description: Missing or invalid parameters
        '500':
          description: Server error
