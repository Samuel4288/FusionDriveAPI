openapi: 3.0.3
info:
  title: Slab Inventory API
  description: API for managing stone slabs, inventory, and catalog information
  version: 1.0.0
servers:
  - url: https://your-api-domain.com
    description: Production server

paths:
  /GetRequirements:
    post:
      summary: Get Requirements
      description: Retrieves material types, finishings, and thickness options available in the inventory
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - LicenseID
                - Password
              properties:
                LicenseID:
                  type: string
                  description: License identifier
                Password:
                  type: string
                  description: Authentication password
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  itemsstonefinishing:
                    type: array
                    items:
                      type: object
                  itemsthickness:
                    type: array
                    items:
                      type: object
                  itemsstonetypes:
                    type: array
                    items:
                      type: object
        '400':
          description: Missing or invalid credentials
        '500':
          description: Server error

  /GetSlabBySerialNumber:
    post:
      summary: Get Slab by Serial Number
      description: Retrieves detailed information about a specific slab using its reference/serial number
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - LicenseID
                - Password
                - SerialNumber
              properties:
                LicenseID:
                  type: string
                  description: License identifier
                Password:
                  type: string
                  description: Authentication password
                SerialNumber:
                  type: string
                  description: Slab reference/serial number
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                  - type: string
                    example: "No Reference found"
                  - type: array
                    items:
                      type: object
                      properties:
                        ID:
                          type: integer
                        BlockName:
                          type: string
                        Reference:
                          type: string
                        JobID:
                          type: string
                        Width:
                          type: number
                        Height:
                          type: number
                        ReceiptWidth:
                          type: number
                        ReceiptHeight:
                          type: number
                        RegDate:
                          type: string
                        ParentSlabID:
                          type: integer
                        IsRemnant:
                          type: integer
                        CostPerM2:
                          type: number
                        thumbnail:
                          type: string
                        MatchURL:
                          type: string
                        EQURL:
                          type: string
                        EdgeURL:
                          type: string
                        OptimizedURL:
                          type: string
                        DrawingInkURL:
                          type: string
                        thumbnailClass:
                          type: string
                        ClassFileURL:
                          type: string
                        RemnantPoints:
                          type: string
                        Status:
                          type: integer
                        StoneTypeName:
                          type: string
                        StoneName:
                          type: string
                        ClassName:
                          type: string
                        FinishingName:
                          type: string
                        ThicknessName:
                          type: string
        '400':
          description: Missing or invalid parameters
        '500':
          description: Server error

  /GetRemnantsByParentID:
    post:
      summary: Get Remnants by Parent ID
      description: Retrieves all remnant pieces associated with a parent slab
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - LicenseID
                - Password
                - ParentSlabID
              properties:
                LicenseID:
                  type: string
                  description: License identifier
                Password:
                  type: string
                  description: Authentication password
                ParentSlabID:
                  type: integer
                  description: ID of the parent slab
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                  - type: string
                    example: "No Remnants found"
                  - type: array
                    items:
                      type: object
                      properties:
                        ID:
                          type: integer
                        BlockName:
                          type: string
                        Reference:
                          type: string
                        JobID:
                          type: string
                        Width:
                          type: number
                        Height:
                          type: number
                        ReceiptWidth:
                          type: number
                        ReceiptHeight:
                          type: number
                        RegDate:
                          type: string
                        IsRemnant:
                          type: integer
                        CostPerM2:
                          type: number
                        thumbnail:
                          type: string
                        MatchURL:
                          type: string
                        EQURL:
                          type: string
                        EdgeURL:
                          type: string
                        OptimizedURL:
                          type: string
                        DrawingInkURL:
                          type: string
                        InkRemnantURL:
                          type: string
                        thumbnailClass:
                          type: string
                        ClassFileURL:
                          type: string
                        RemnantPoints:
                          type: string
                        ParentSlabID:
                          type: integer
                        Status:
                          type: integer
                        StoneTypeName:
                          type: string
                        StoneName:
                          type: string
                        ClassName:
                          type: string
                        FinishingName:
                          type: string
                        ThicknessName:
                          type: string
        '400':
          description: Missing or invalid parameters
        '500':
          description: Server error

  /UpdateSlabs:
    post:
      summary: Update Slabs
      description: Updates status and other properties of existing slabs
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - LicenseID
                - Password
                - Slabs
              properties:
                LicenseID:
                  type: string
                  description: License identifier
                Password:
                  type: string
                  description: Authentication password
                Slabs:
                  type: string
                  description: JSON array of slab objects with ID and Status fields
                  example: '[{"ID":1,"Status":2},{"ID":5,"Status":4}]'
                UserID:
                  type: string
                  description: User identifier
                  default: "0"
                WinType:
                  type: string
                  description: Window type
                  default: "2"
                ProjectID:
                  type: string
                  description: Project identifier
                  default: "0"
                ProjectSequenceID:
                  type: string
                  description: Project sequence identifier
                  default: "0"
                Note:
                  type: string
                  description: Additional notes
                  default: "0"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing or invalid parameters
        '500':
          description: Server error

  /AddSlabs:
    post:
      summary: Add Slabs
      description: Adds new slabs to inventory with automatic stone name and class creation if needed. Maximum 5 slabs per request.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - LicenseID
                - Password
                - Slabs
              properties:
                LicenseID:
                  type: string
                  description: License identifier
                Password:
                  type: string
                  description: Authentication password
                Slabs:
                  type: string
                  description: JSON array of slab objects (max 5 slabs)
                  example: |
                    [
                      {
                        "Reference": "REF001",
                        "Material": "Granite",
                        "StoneName": "Black Galaxy",
                        "ClassName": "Premium",
                        "Finishing": "Polished",
                        "Thickness": "20",
                        "Width": 120.5,
                        "Height": 280.0,
                        "BlockName": "Block A"
                      }
                    ]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "All references already exist"
                  - type: object
        '400':
          description: Missing or invalid parameters, or exceeded 5 slab limit
        '500':
          description: Server error

  /addSlabsDirect:
    post:
      summary: Add Slabs Direct
      description: Adds new slabs with pre-validated ClassIDs. Faster than AddSlabs but requires ClassID. Maximum 40 slabs per request.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - LicenseID
                - Password
                - Slabs
              properties:
                LicenseID:
                  type: string
                  description: License identifier
                Password:
                  type: string
                  description: Authentication password
                Slabs:
                  type: string
                  description: JSON array of slab objects with ClassID already set (max 40 slabs)
                  example: |
                    [
                      {
                        "Reference": "REF001",
                        "ClassID": 12345,
                        "Width": 120.5,
                        "Height": 280.0,
                        "BlockName": "Block A"
                      }
                    ]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: "All references already exist"
                  - type: object
        '400':
          description: Invalid parameters - missing ClassID, exceeded 40 slab limit, or duplicate references
        '500':
          description: Server error

  /getInventoryCatalog:
    post:
      summary: Get Inventory Catalog
      description: Retrieves complete denormalized catalog of all stone classes with material, finishing, and thickness information
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - LicenseID
                - Password
              properties:
                LicenseID:
                  type: string
                  description: License identifier
                Password:
                  type: string
                  description: Authentication password
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  classes:
                    type: array
                    items:
                      type: object
                      properties:
                        classId:
                          type: integer
                        materialName:
                          type: string
                        stoneName:
                          type: string
                        className:
                          type: string
                        thickness:
                          type: integer
                        finishing:
                          type: string
                        stoneNameId:
                          type: integer
                        materialId:
                          type: integer
                        finishingId:
                          type: integer
                        thicknessId:
                          type: integer
                  metadata:
                    type: object
                    properties:
                      totalClasses:
                        type: integer
                      totalStoneNames:
                        type: integer
                      generatedAt:
                        type: string
                        format: date-time
        '400':
          description: Missing or invalid credentials
        '500':
          description: Server error

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
